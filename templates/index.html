<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEest Functional Fitness</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Chart.js for rendering the Progress Chart natively -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Header Block -->
    <header>
        <h1>ACEest Functional Fitness System</h1>
    </header>

    <!-- Main Container Layout -->
    <div class="main-container">

        <!-- Left Panel: Client Profile Form -->
        <aside class="left-panel">
            <form id="client-form" class="group-box" onsubmit="event.preventDefault();">
                <span class="group-box-title"> Client Profile </span>

                <!-- Client Selector Dropdown -->
                <div class="input-group">
                    <label for="client-selector">Select Client</label>
                    <select id="client-selector" onchange="onClientSelected(this.value)">
                        <option value="">-- Select Existing Client --</option>
                    </select>
                </div>

                <!-- Client Input Elements -->
                <div class="input-group">
                    <label for="client-name">Name</label>
                    <input type="text" id="client-name" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="client-age">Age</label>
                    <input type="text" id="client-age" value="0">
                </div>

                <div class="input-group">
                    <label for="client-height">Height (cm)</label>
                    <input type="text" id="client-height" value="0.0">
                </div>

                <div class="input-group">
                    <label for="client-weight">Weight (kg)</label>
                    <input type="text" id="client-weight" value="0.0">
                </div>

                <div class="input-group">
                    <label class="select-label" for="my-combobox">Program</label>
                    <select id="my-combobox" class="combobox" name="program">
                        <option value="" selected>-- Select a program --</option>
                    </select>
                </div>

                <!-- Goals Section -->
                <div class="input-group">
                    <label for="target-weight">Target Weight (kg)</label>
                    <input type="number" step="0.1" id="target-weight" value="0.0">
                </div>

                <div class="input-group">
                    <label for="target-adherence">Target Adherence %</label>
                    <input type="number" id="target-adherence" value="0">
                </div>

                <div class="input-group">
                    <label for="adherence-slider">Weekly Adherence (<span id="adherence-val">0</span>%)</label>
                    <input type="range" id="adherence-slider" min="0" max="100" value="0" oninput="document.getElementById('adherence-val').innerText = this.value">
                </div>

                <!-- Interface Control Buttons Structure Map -->
                <div class="button-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;">
                    <button type="button" class="btn btn-export" onclick="saveClient()" style="grid-column: span 1; padding: 10px; font-weight: bold; background:#d4af37; color:#000;">Save Client</button>
                    <button type="button" class="btn btn-export" onclick="loadClient()" style="grid-column: span 1; padding: 10px; font-weight: bold; background:#444; color:#fff;">Load Client</button>
                    <button type="button" class="btn btn-export" onclick="saveProgress()" style="grid-column: span 2; padding: 10px; font-weight: bold; background:#444; color:#fff;">Save Weekly Progress</button>
                    <button type="button" class="btn btn-export" onclick="openLogWorkoutModal()" style="grid-column: span 1; padding: 10px; font-weight: bold; background:#444; color:#fff;">Log Workout</button>
                    <button type="button" class="btn btn-export" onclick="openLogMetricsModal()" style="grid-column: span 1; padding: 10px; font-weight: bold; background:#444; color:#fff;">Log Body Metrics</button>
                    <button type="button" class="btn btn-export" onclick="loadWorkoutHistory()" style="grid-column: span 2; padding: 10px; font-weight: bold; background-color: #333; color: #d4af37; border: 1px solid #d4af37;">View Workout History</button>
                </div>
            </form>
        </aside>

        <!-- Right Panel: Display Elements, Tables, and Charts -->
        <main class="right-panel">

            <!-- Horizontal Tab Selection Architecture Layout -->
            <div class="tab-controls" style="margin-bottom: 20px; display: flex; gap: 4px; border-bottom: 2px solid #333; width: 100%;">
                <button type="button" class="btn" id="btn-summary" onclick="switchTab('summary')" style="flex: 1; max-width: 220px; padding: 12px; background: #222; color: #d4af37; border: none; border-bottom: 3px solid #d4af37; cursor: pointer; font-weight: bold; text-align: center;">Client Summary</button>
                <button type="button" class="btn" id="btn-analytics" onclick="switchTab('analytics')" style="flex: 1; max-width: 220px; padding: 12px; background: #111; color: #888; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: bold; text-align: center;">Progress & Analytics</button>
            </div>

            <!-- Tab 1: Summary Output Shell -->
            <div id="tab-summary" class="tab-content">
                <div class="group-box text-block-frame">
                    <span class="group-box-title"> Client Summary </span>
                    <pre id="work-label" class="scrollable-block" style="font-family: 'Consolas', monospace; white-space: pre-wrap; background:#111; color:#fff; padding: 10px; border-radius:4px;">— No Client Loaded —</pre>
                </div>

                <!-- Workout History Section -->
                <div class="group-box" style="margin-top: 20px;">
                    <span class="group-box-title"> Workout History </span>
                    <div class="table-container" style="max-height: 200px; overflow-y: auto;">
                        <table id="workout-history-table" style="width:100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="background-color: #333; color: #d4af37;">
                                    <th style="padding: 8px;">Date</th>
                                    <th style="padding: 8px;">Type</th>
                                    <th style="padding: 8px;">Duration (min)</th>
                                    <th style="padding: 8px;">Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="4" style="padding: 8px; text-align: center;">No history logs loaded</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Analytics & Canvas Presentation Context -->
            <div id="tab-analytics" class="tab-content" style="display: none; padding-top: 15px;">
                <!-- Modernized Row Layout For Analytics Control Elements -->
                <div class="button-group" style="display: flex; flex-direction: row; justify-content: flex-start; gap: 10px; margin-bottom: 20px; width: 100%;">
                    <button type="button" class="btn" onclick="renderAdherenceChart()" style="flex: 1; max-width: 200px; padding: 10px; background: #333; color: #fff; border: 1px solid #555; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s;">Adherence Chart</button>
                    <button type="button" class="btn" onclick="renderWeightChart()" style="flex: 1; max-width: 200px; padding: 10px; background: #333; color: #fff; border: 1px solid #555; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s;">Weight Trend Chart</button>
                    <button type="button" class="btn" onclick="showBMIInfo()" style="flex: 1; max-width: 200px; padding: 10px; background: #333; color: #fff; border: 1px solid #555; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s;">BMI & Risk Info</button>
                </div>

                <!-- High-Contrast Analytics Rendering Canvas Envelope Box -->
                <div class="group-box" style="background-color: #ffffff; padding: 20px; border: 2px solid #d4af37; border-radius: 6px; min-height: 380px;">
                    <span class="group-box-title" id="chart-title" style="color: #d4af37; font-weight: bold; font-size: 14px; background-color: #1a1a1a;">Weekly Adherence Chart</span>
                    <div style="width: 100%; max-width: 100%; height: 320px; position: relative; margin-top: 10px;">
                        <canvas id="analyticsChart"></canvas>
                    </div>
                </div>


            </div>

        </main>
    </div>

    <!-- Modals for Logging Actions -->
    <div id="workout-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
        <div class="group-box" style="background:#1a1a1a; width:400px; padding:20px; border:1px solid #d4af37;">
            <span class="group-box-title">Log Workout</span>
                        <div class="input-group"><label>Workout Type</label><select id="modal-w-type"><option>Strength</option><option>Hypertrophy</option><option>Conditioning</option><option>Mixed</option><option>Mobility</option></select></div>
            <div class="input-group"><label>Duration (min)</label><input type="number" id="modal-w-dur" value="60"></div>
            <div class="input-group"><label>Exercise Name</label><input type="text" id="modal-w-ex-name"></div>
            <div class="input-group"><label>Sets</label><input type="number" id="modal-w-sets" value="3"></div>
            <div class="input-group"><label>Reps</label><input type="number" id="modal-w-reps" value="10"></div>
            <div class="input-group"><label>Weight (kg)</label><input type="number" step="0.1" id="modal-w-weight" value="0.0"></div>
            <div class="input-group"><label>Notes</label><input type="text" id="modal-w-notes"></div>
            <div class="button-group" style="margin-top:10px; display:flex; flex-direction:row; gap:10px;">
                <button type="button" class="btn" onclick="submitWorkout()" style="background:#d4af37; color:#000;">Save Workout</button>
                <button type="button" class="btn" onclick="document.getElementById('workout-modal').style.display='none'" style="background:#444; color:#fff;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Body Metrics Overlay Modal Popup -->
    <div id="metrics-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
        <div class="group-box" style="background:#1a1a1a; width:350px; padding:20px; border:1px solid #d4af37;">
            <span class="group-box-title">Log Body Metrics</span>
            <div class="input-group"><label>Weight (kg)</label><input type="number" step="0.1" id="modal-m-weight" value="0.0"></div>
            <div class="input-group"><label>Waist (cm)</label><input type="number" step="0.1" id="modal-m-waist" value="0.0"></div>
            <div class="input-group"><label>Bodyfat (%)</label><input type="number" step="0.1" id="modal-m-bf" value="0.0"></div>
            <div class="button-group" style="margin-top:10px; display:flex; flex-direction:row; gap:10px;">
                <button type="button" class="btn" onclick="submitMetrics()" style="background:#d4af37; color:#000;">Save Metrics</button>
                <button type="button" class="btn" onclick="document.getElementById('metrics-modal').style.display='none'" style="background:#444; color:#fff;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Decoupled JavaScript Script Link Target Entry -->
    <script src="/static/app.js"></script>
</body>
</html>
