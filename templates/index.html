<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEest Functional Fitness</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>ACEest FUNCTIONAL FITNESS SYSTEM</h1>
    </header>

    <!-- Main Container Layout -->
    <div class="main-container">
        
        <!-- Left Panel: Client Profile Form -->
        <aside class="left-panel">
            <form id="client-form" class="group-box" onsubmit="event.preventDefault();">
                <span class="group-box-title"> Client Profile </span>
                
                <!-- Client Input Elements -->
                <div class="input-group">
                    <label for="client-name">Name</label>
                    <input type="text" id="client-name" placeholder="Enter client name" required>
                </div>

                <div class="input-group">
                    <label for="client-age">Age</label>
                    <input type="number" id="client-age" value="0" min="0">
                </div>

                <div class="input-group">
                    <label for="client-weight">Weight (kg)</label>
                    <!-- Listens to biometric keystrokes for active calorie math updates -->
                    <input type="number" id="client-weight" value="0" min="0" step="0.1">
                </div>

                <div class="input-group">
                    <label class="select-label" for="my-combobox">Program</label>
                    <select id="my-combobox" class="combobox" name="program" required onchange="updateDisplay(this.value)">
                        <option value="" disabled selected>Loading programs...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="adherence-slider">Weekly Adherence (<span id="adherence-val">0</span>%)</label>
                    <input type="range" id="adherence-slider" min="0" max="100" value="0" oninput="document.getElementById('adherence-val').innerText = this.value">
                </div>

                <!-- Interface Control Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-save" onclick="saveClient()">Save Client</button>
                    <button type="button" class="btn btn-reset" onclick="resetForm()">Reset</button>
                </div>

                
            </form>
        </aside>

        <!-- Right Panel: Display Charts -->
        <main class="right-panel">
            
            <!-- Weekly Workout Chart Display Box -->
            <div class="group-box text-block-frame">
                <span class="group-box-title"> Weekly Training Plan </span>
                <div id="work-label" class="scrollable-block"></div>
            </div>

            <!-- Diet Chart Display Box (Tamil Nadu Context) -->
            <div class="group-box text-block-frame">
                <span class="group-box-title"> Nutrition Plan (TN Context) </span>
                <div id="diet-label" class="scrollable-block"></div>
            </div>

            <!-- Dynamic Live Calorie Output Label -->
            <div id="calorie-label" class="calorie-display">Estimated Calories: --</div>

        </main>
    </div>

    <!-- Interface Logic Framework -->
    <script>
        // Globally cached tracking reference for user calculation variables
        let currentCalorieFactor = 0;

        document.addEventListener("DOMContentLoaded", function() {
            // Step 1: Initialise the Combobox with the dynamic plan list on load
            fetch("/api/v1.0/programs") 
                .then(response => response.json())
                .then(data => {
                    const combobox = document.getElementById("my-combobox");
                    combobox.innerHTML = '<option value="" disabled selected>-- Select a program --</option>';
                    
                    const programList = data.programs || data;
                    
                    programList.forEach(program => {
                        const option = document.createElement("option");
                        option.value = program;
                        option.textContent = program;
                        combobox.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error("Initial load error:", error);
                    document.getElementById("my-combobox").innerHTML = '<option value="" disabled>Error loading profiles</option>';
                });
        });

        // Step 2: Corresponds to Tkinter's 'update_display' / 'update_program' method
        function updateDisplay(selectedProgram) {
            if (!selectedProgram) return;

            const workLabel = document.getElementById("work-label");
            const dietLabel = document.getElementById("diet-label");

            workLabel.innerText = "Loading workout content...";
            dietLabel.innerText = "Loading meal plan specifications...";
            workLabel.style.color = "#ffffff"; 

            // Dispatches user selection state back to Python API route
            fetch(`/api/v1.0/entire_plan?program_name=${encodeURIComponent(selectedProgram)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Server metrics collection rejected");
                    return response.json();
                })
                .then(data => {
                    // Update text blocks with explicit backend parameter names
                    workLabel.innerText = data.weekly_workout_chart || "No routine defined.";
                    workLabel.style.color = data.ui_color || "#ffffff"; 
                    dietLabel.innerText = data.daily_nutrition_plan || "No diet defined.";
                    
                    // Cache the calculation variable and execute fresh calorie evaluations
                    currentCalorieFactor = data.calorie_factor || 0;
                    calculateCalories();
                })
                .catch(error => {
                    console.error("Selection update failure:", error);
                    workLabel.innerText = "Failed to pull system profiles.";
                    dietLabel.innerText = "Failed to pull nutrition metrics.";
                });
        }

        // Step 3: Implements weight-based calorie calculations instantly
        function calculateCalories() {
            const name = document.getElementById("client-name").value.trim();
            const age = parseInt(document.getElementById("client-age").value) || 0;
            const weight = parseFloat(document.getElementById("client-weight").value) || 0;
            const program = document.getElementById("my-combobox").value;
            const adherence = parseInt(document.getElementById("adherence-slider").value) || 0;

            // 1. Client-side validation block
            if (!name || !program) {
                alert("Please fill client name and program.");
                return;
            }
                       
            const label = document.getElementById("calorie-label");

            const payload = {
                name: name,
                weight: weight,
                program: program
            };
            fetch(`/api/v1.1/calculate_calories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error("Calorie calculation request failed");
                return response.json();
            })
            .then(data => {
                const totalCalories = data.calories;
                label.innerText = `Estimated Calories: ${totalCalories} kcal`;
            })
            .catch(error => {
                console.error("Calorie calculation error:", error);
                label.innerText = "Estimated Calories: --";
            });

        }

        // Step 4: Handles profile data validation notifications
        function saveClient() {
            const name = document.getElementById("client-name").value.trim();
            const age = parseInt(document.getElementById("client-age").value) || 0;
            const weight = parseFloat(document.getElementById("client-weight").value) || 0;
            const program = document.getElementById("my-combobox").value;
            const adherence = parseInt(document.getElementById("adherence-slider").value) || 0;

            // 1. Client-side validation block
            if (!name || !program) {
                alert("Please fill client name and program.");
                return;
            }

            // 2. Build the JSON data payload matching your Python backend expectations
            const payload = {
                name: name,
                age: age,
                weight: weight,
                program: program,
                progress: adherence // Maps cleanly to data.get("progress") in Python
            };

            const label = document.getElementById("calorie-label");
            fetch(`/api/v1.1/calculate_calories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error("Calorie calculation request failed");
                return response.json();
            })
            .then(data => {
                const totalCalories = data.calories;
                label.innerText = `Estimated Calories: ${totalCalories} kcal`;
            })
            .catch(error => {
                console.error("Calorie calculation error:", error);
                label.innerText = "Estimated Calories: --";
            });

            // 3. Dispatch POST request to the correct v1.1 API endpoint
            fetch('/api/v1.1/save_client', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || "Server validation rejected"); });
                }
                return response.json();
            })
            .then(data => {
                // 4. Pop standard alert using the exact processing string returned from Python
                alert(`${data.success}\nAdherence level: ${data.adherence}%\nEstimated Calories: ${data.calculated_calories} kcal`);
            })
            .catch(error => {
                console.error("Save Client Error:", error);
                alert(`Error: ${error.message}`);
            });
        }

        

        // Step 5: Restores form states clean
        function resetForm() {
    // 1. Dispatch the request to the correct v1.1 endpoint defined in your app.py
    fetch("/api/v1.1/reset")
        .then(response => {
            if (!response.ok) throw new Error("Reset operation failed");
            return response.json();
        })
        .then(data => {
            console.log("Form reset successful:", data);
            
            // FIX: All UI manipulation using 'data' MUST happen inside this block!
            document.getElementById("client-name").value = data.name || "";
            document.getElementById("client-age").value = data.age || "0";
            document.getElementById("client-weight").value = data.weight || "0";
            document.getElementById("my-combobox").value = data.program || "";
            document.getElementById("adherence-slider").value = data.adherence || "0";
            document.getElementById("adherence-val").innerText = data.adherence || "0";
            
            const workLabel = document.getElementById("work-label");
            const dietLabel = document.getElementById("diet-label");
            
            workLabel.innerText = data.weekly_workout_chart || "";
            workLabel.style.color = "#ffffff";
            dietLabel.innerText = data.daily_nutrition_plan || "";
            
            // Matches data.total_calories precisely with your Python reset dictionary keys
            document.getElementById("calorie-label").innerText = `Estimated Calories: ${data.total_calories || '--'}`;
            
            currentCalorieFactor = 0;
        })
        .catch(error => {
            console.error("Form reset error:", error);
            
            // Fallback: Clear the inputs client-side anyway even if the network fails
            document.getElementById("client-form").reset();
            document.getElementById("adherence-val").innerText = data.adherence || "0";
            document.getElementById("work-label").innerText = data.weekly_workout_chart ||"";
            document.getElementById("work-label").style.color = "#ffffff";
            document.getElementById("diet-label").innerText = data.daily_nutrition_plan ||"";
            document.getElementById("calorie-label").innerText = `Estimated Calories: ${data.total_calories || '--'}`;
        });
}

    </script>
</body>
</html>
