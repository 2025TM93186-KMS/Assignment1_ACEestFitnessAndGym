<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEest Functional Fitness</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Chart.js for rendering the Progress Chart natively -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Header Block -->
    <header>
        <h1>ACEest FUNCTIONAL FITNESS SYSTEM v2</h1>
    </header>

    <!-- Main Container Layout -->
    <div class="main-container">

        <!-- Left Panel: Client Profile Form -->
        <aside class="left-panel">
            <form id="client-form" class="group-box" onsubmit="event.preventDefault();">
                <span class="group-box-title"> Client Profile </span>

                <!-- Client Input Elements -->
                <div class="input-group">
                    <label for="client-name">Name</label>
                    <input type="text" id="client-name" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="client-age">Age</label>
                    <input type="text" id="client-age" value="0">
                </div>

                <div class="input-group">
                    <label for="client-weight">Weight (kg)</label>
                    <input type="text" id="client-weight" value="0.0">
                </div>

                <div class="input-group">
                    <label class="select-label" for="my-combobox">Program</label>
                    <select id="my-combobox" class="combobox" name="program" onchange="updateProgram(this.value)">
                        <option value="" selected>-- Select a program --</option>
                        <option value="Fat Loss (FL)">Fat Loss (FL)</option>
                        <option value="Muscle Gain (MG)">Muscle Gain (MG)</option>
                        <option value="Beginner (BG)">Beginner (BG)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="adherence-slider">Weekly Adherence (<span id="adherence-val">0</span>%)</label>
                    <input type="range" id="adherence-slider" min="0" max="100" value="0" oninput="document.getElementById('adherence-val').innerText = this.value">
                </div>

                <div class="input-group">
                    <label for="client-notes">Coach Notes</label>
                    <input type="text" id="client-notes" autocomplete="off">
                </div>

                <!-- Interface Control Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-save" onclick="saveClient()">Save Client</button>
                    <button type="button" class="btn btn-export" onclick="exportCSV()">Export CSV</button>
                    <button type="button" class="btn btn-reset" onclick="resetForm()">Reset</button>
                </div>
            </form>
        </aside>

        <!-- Right Panel: Display Elements, Tables, and Charts -->
        <main class="right-panel">

            <!-- Weekly Workout Chart Display Box -->
            <div class="group-box text-block-frame">
                <span class="group-box-title"> Weekly Training Plan </span>
                <div id="work-label" class="scrollable-block">—</div>
            </div>

            <!-- Diet Chart Display Box (Tamil Nadu Context) -->
            <div class="group-box text-block-frame">
                <span class="group-box-title"> Nutrition Plan </span>
                <div id="diet-label" class="scrollable-block">—</div>
            </div>

            <!-- Dynamic Live Calorie Output Label -->
            <div id="calorie-label" class="calorie-display">Estimated Calories: --</div>

            <!-- CLIENT LIST TABLE -->
            <div class="group-box table-frame">
                <span class="group-box-title"> Client List </span>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Weight</th>
                                <th>Program</th>
                                <th>Adherence</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="client-table-body">
                            <!-- Rows dynamically populated locally -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- PROGRESS CHART -->
            <div class="group-box chart-frame">
                <span class="group-box-title"> Progress Chart </span>
                <div class="canvas-wrapper" style="position: relative; height:200px; width:100%;">
                    <canvas id="progress-chart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <!-- Interface Logic Framework -->
    <script>
        // Local state storage array to keep records in memory matching Python lists
        const clients = [];
        let chartInstance = null;

        // Equivalent map configuration block directly matching self.programs data structure
        const programs = {
            "Fat Loss (FL)": {
                "workout": "Back Squat, Cardio, Bench, Deadlift, Recovery",
                "diet": "Egg Whites, Chicken, Fish Curry",
                "color": "#e74c3c",
                "calorie_factor": 22
            },
            "Muscle Gain (MG)": {
                "workout": "Squat, Bench, Deadlift, Press, Rows",
                "diet": "Eggs, Biryani, Mutton Curry",
                "color": "#2ecc71",
                "calorie_factor": 35
            },
            "Beginner (BG)": {
                "workout": "Air Squats, Ring Rows, Push-ups",
                "diet": "Balanced Tamil Meals",
                "color": "#3498db",
                "calorie_factor": 26
            }
        };

        document.addEventListener("DOMContentLoaded", function() {
            //initChart();
        });

        // Corresponds to Tkinter's 'update_program' method
        function updateProgram(selectedProgram) {
            const workLabel = document.getElementById("work-label");
            const dietLabel = document.getElementById("diet-label");

            if (!selectedProgram) {
                workLabel.innerText = "—";
                workLabel.style.color = "#ffffff";
                dietLabel.innerText = "—";
                calculateCalories();
                return;
            }

            const data = programs[selectedProgram];
            workLabel.innerText = data.workout;
            workLabel.style.color = data.color;
            dietLabel.innerText = data.diet;
            dietLabel.style.color = "white";

            calculateCalories();
        }

        // Live calculation matching target weight updates on input
        function calculateCalories() {
            const program = document.getElementById("my-combobox").value;
            const weightInput = document.getElementById("client-weight").value;
            const label = document.getElementById("calorie-label");

            if (!program) {
                label.innerText = "Estimated Calories: --";
                return;
            }

            const payload = {
                name: name,
                age: age,
                weight: weight,
                program: program,
                progress: adherence // Maps cleanly to data.get("progress") in Python
            };
            fetch(`/api/v1.1/calculate_calories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error("Calorie calculation request failed");
                return response.json();
            })
            .then(data => {
                const totalCalories = data.calories;
                label.innerText = `Estimated Calories: ${totalCalories} kcal`;
            })
            .catch(error => {
                console.error("Calorie calculation error:", error);
                label.innerText = "Estimated Calories: --";
            });


        }

        // Corresponds to Tkinter's 'save_client' method
        function saveClient() {
            const name = document.getElementById("client-name").value.trim();
            const program = document.getElementById("my-combobox").value;
            const ageInput = document.getElementById("client-age").value;
            const weightInput = document.getElementById("client-weight").value;
            const adherence = parseInt(document.getElementById("adherence-slider").value) || 0;
            const notes = document.getElementById("client-notes").value.trim();

            if (!name || !program) {
                alert("Please fill client name and program.");
                return;
            }

            let age, weight;
            try {
                age = parseInt(ageInput);
                weight = parseFloat(weightInput);
                if (isNaN(age) || isNaN(weight)) {
                    throw new Error();
                }
            } catch (e) {
                alert("Age must be an integer and Weight must be a number.");
                return;
            }

            //const client = [name, age, weight, program, adherence, notes];
            //clients.push(client);

             const payload = {
                name: name,
                age: age,
                weight: weight,
                program: program,
                progress: adherence // Maps cleanly to data.get("progress") in Python
            };

            fetch('/api/v1.1/save_client', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || "Server validation rejected"); });
                }
                return response.json();
            })
            .then(data => {
                // 4. Pop standard alert using the exact processing string returned from Python
                alert(`${data.success}\nAdherence level: ${data.adherence}%\nEstimated Calories: ${data.calculated_calories} kcal`);
            })
            .catch(error => {
                console.error("Save Client Error:", error);
                alert(`Error: ${error.message}`);
            });


            // Add dynamic table row layout instantly
            const tableBody = document.getElementById("client-table-body");
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${name}</td>
                <td>${age}</td>
                <td>${weight}</td>
                <td>${program}</td>
                <td>${adherence}%</td>
                <td>${notes || '—'}</td>
            `;
            tableBody.appendChild(tr);

            updateChart();
            alert(data.message);
        }

        function updateChart() {
            if (!chartInstance) return;
            fetch(`/api/v1.1.2/client?name=${encodeURIComponent(document.getElementById("client-name").value.trim())}`)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch client data for chart");
                    return response.json();
                })
                .then(data => {
                    const clientDataset = data.client ? [data.client] : [];
                })
                .catch(error => {
                    console.error("Chart Update Error:", error);
                });
            chartInstance.data.labels = clientDataset.map(c => c.name);
            chartInstance.data.datasets[0].data = clientDataset.map(c => c.adherence);
            chartInstance.update();
        }


        function exportCSV() {
        alert('Exporting...');

        }
     </script>
</body>
</html>
